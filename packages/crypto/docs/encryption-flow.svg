  <rect class="server-store" x="500" y="970" width="1000" height="120" rx="12" stroke-width="1.7"/>
  <text class="text" x="1000" y="1005" font-size="19" font-weight="600" text-anchor="middle">Comitium storage</text>
  <line class="storage-rule" x1="530" y1="1022" x2="1470" y2="1022" stroke-width="1"/>
  <line class="storage-rule" x1="830" y1="1022" x2="830" y2="1072" stroke-width="1"/>
  <line class="storage-rule" x1="1170" y1="1022" x2="1170" y2="1072" stroke-width="1"/>
  <text class="text" x="665" y="1050" font-size="15.5" font-weight="600" text-anchor="middle">Personal identity</text>
  <text class="muted" x="665" y="1072" font-size="12.5" text-anchor="middle">public and wrapped keys</text>
  <text class="text" x="1000" y="1050" font-size="15.5" font-weight="600" text-anchor="middle">Organization vault</text>
  <text class="muted" x="1000" y="1072" font-size="12.5" text-anchor="middle">public key and member wraps</text>
  <text class="text" x="1335" y="1050" font-size="15.5" font-weight="600" text-anchor="middle">Encrypted content</text>
  <text class="muted" x="1335" y="1072" font-size="12.5" text-anchor="middle">versioned envelopes</text>
</svg>
