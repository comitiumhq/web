name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ENVIRONMENT: development
      VITE_CHAIN: testnet
      VITE_API: https://api.example.invalid
      VITE_APP_ORIGIN: https://app.example.invalid
      VITE_MY_ORIGIN: https://my.example.invalid
      VITE_PUBLIC_SITE_ORIGIN: https://example.invalid
      VITE_PRIVY_APP_ID: ci-placeholder
      VITE_BASE_RPC_URL: https://base-sepolia-rpc.example.invalid
      VITE_FILEBASE_GATEWAY_BASE_URL: https://gateway.example.invalid
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium --with-deps

      - name: Check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test --run

      - name: Build public site
        run: bun run build:site
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build personal app
        run: bun run build:my
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build organization app
        run: bun run build:app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
